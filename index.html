<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>音频播放</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      padding: 20px;
    }
    .card {
      background: #fff;
      border-radius: 20px;
      padding: 40px 32px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      text-align: center;
    }
    .card h2 {
      margin: 0 0 8px;
      font-size: 20px;
      color: #333;
    }
    .card p {
      margin: 0 0 24px;
      color: #888;
      font-size: 14px;
    }
    audio {
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>陆老师自我介绍</h2>
    <p>点击下方按钮播放音频</p>
    <audio controls src="陆老师自我介绍.mp3"></audio>
  </div>
</body>
</html>
